[package]
name = "gcam"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "default-tls", "cookies"] }
urlencoding = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
rsa = "0.9.10"
md5 = "0.8.1"
aes = "0.8"
hmac = "0.12"
sha2 = "0.10"
socket2 = "0.6"
